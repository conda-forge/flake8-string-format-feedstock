{% set name = "flake8-string-format" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 817431aeed09a9cad28099425b5a2a03d58c10e9460dcf8475d7f923ac10f26a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - flake8

test:
  imports:
    - flake8_string_format
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/xZise/flake8-string-format
  summary: string format checker, plugin for flake8
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - luftuq
